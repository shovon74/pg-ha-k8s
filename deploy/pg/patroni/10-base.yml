# Patroni L1 base config. Per-pod values (name, addresses, passwords) come from environment variables.
# L3 adds archive_mode, archive_command and restore_command in a later file (20-archive.yml), which
# Patroni merges over this one.
scope: pg-rw            # Patroni names the leader Endpoints after the scope, so this is the pg-rw Service
restapi:
  listen: 0.0.0.0:8008
  # L6 (ADR-012): with authentication set, Patroni requires HTTP basic auth for every state-changing request
  # (POST, PUT, PATCH, DELETE: switchover, failover, restart, reinitialize, config, ...). GET stays open, so the
  # kubelet probes (/readiness, /liveness), Prometheus (/metrics) and scripts/status.sh (/cluster) are unchanged.
  # Username and password come from PATRONI_RESTAPI_USERNAME and PATRONI_RESTAPI_PASSWORD (pg-credentials).
kubernetes:             # ADR-002
  use_endpoints: true
  labels: {app.kubernetes.io/name: pg, cluster-name: pg-rw}
  role_label: role
  ports: [{name: postgresql, port: 5432}]
bootstrap:
  dcs:
    ttl: 20             # ADR-006: loop_wait + 2 x retry_timeout = 13 s < ttl
    loop_wait: 3
    retry_timeout: 5
    primary_start_timeout: 0
    maximum_lag_on_failover: 1048576
    synchronous_mode: true          # ADR-004: non-strict, one synchronous standby
    synchronous_mode_strict: false
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: false          # ADR-008 (L3): rejoin by re-clone, see remove_data_directory_on_diverged_timelines
      use_slots: true               # ADR-005
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"         # ADR-008, in addition to data checksums
        max_wal_size: 512MB         # ADR-005
        max_slot_wal_keep_size: 1GB # ADR-005: hard cap on WAL held for slots
        max_wal_senders: 10
        max_replication_slots: 10
        max_connections: 100
        shared_buffers: 128MB
        password_encryption: scram-sha-256
  initdb:
    - data-checksums
    - encoding: UTF8
  post_bootstrap: /etc/patroni/scripts/post-bootstrap.sh
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /data/pgdata            # a subdirectory of the volume, created 0700 (S3)
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /tmp/pgpass
  use_unix_socket: true
  # ADR-008 (L3): a diverged member is re-cloned with pg_basebackup instead of rewound. pg_rewind copied WAL
  # files without archive status, and after a later promotion they blocked archiving ("different checksum").
  # The divergence check still connects as the rewind role.
  remove_data_directory_on_diverged_timelines: true
  # L6 (ADR-012, R8.4): replication (streaming, pg_basebackup re-clone) and the rewind role's divergence check
  # connect over TLS and verify the server certificate against the L0 CA and the member's DNS name. Usernames
  # and passwords still come from the environment; Patroni deep-merges these keys with them.
  authentication:
    replication:
      sslmode: verify-full
      sslrootcert: /etc/pg-tls/ca.crt
    rewind:
      sslmode: verify-full
      sslrootcert: /etc/pg-tls/ca.crt
  parameters:
    unix_socket_directories: /var/run/postgresql
    # Server TLS with the L0 certificate (SANs: pg-N.pg-headless, pg-rw, pg-ro in pg-ha and pg-restore).
    ssl: "on"
    ssl_cert_file: /etc/pg-tls/tls.crt
    ssl_key_file: /etc/pg-tls/tls.key
    ssl_ca_file: /etc/pg-tls/ca.crt
    ssl_min_protocol_version: TLSv1.2
  # L6 (ADR-012, R8.4, R8.5): first match wins. Every connection from the pod network must use TLS and SCRAM.
  # Loopback stays host (TLS optional) for the exporter sidecar (monitor, sslmode=require) and Patroni's local
  # replication check; that traffic never leaves the pod. Nobody logs in remotely as the superuser: Patroni,
  # post_bootstrap and pgBackRest use the local socket. Anything else, including any non-TLS remote attempt,
  # is rejected explicitly.
  pg_hba:
    - local all all peer
    - host replication replicator 127.0.0.1/32 scram-sha-256   # Patroni's local timeline check on replicas
    - host all all 127.0.0.1/32 scram-sha-256                  # exporter sidecar (monitor) and local tools
    - hostssl all postgres 0.0.0.0/0 reject
    - hostssl replication replicator 10.42.0.0/16 scram-sha-256
    - hostssl all all 10.42.0.0/16 scram-sha-256
    - host all all 0.0.0.0/0 reject
    - host replication all 0.0.0.0/0 reject
