# ADR-009: every repo1-* setting lives here and nowhere else. Loaded from /etc/pgbackrest/conf.d by the
# Postgres pods (archive-push, archive-get) and by the stanza and backup Jobs. Credentials are not here:
# PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET and PGBACKREST_REPO1_CIPHER_PASS come from the
# pgbackrest-repo Secret at runtime. A GCS overlay (R4.7) would replace only this file.
# Plain HTTP as proven in spike S1: Garage has no native TLS (ADR-014), so repository encryption protects
# the content and SigV4 keeps the secret key off the wire.
[global]
repo1-type=s3
repo1-s3-endpoint=http://garage.pg-ha.svc.cluster.local:3900
repo1-s3-bucket=pgbackrest
repo1-s3-region=garage
repo1-s3-uri-style=path
repo1-path=/pg-ha
repo1-cipher-type=aes-256-cbc
repo1-retention-full=7
