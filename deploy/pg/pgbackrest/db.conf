# pgBackRest on the Postgres pods: stanza, Postgres and process settings only (ADR-009). The postgres
# container runs archive-push and archive-get. The pgbackrest sidecar runs the TLS server that the stanza
# and backup Jobs reach on port 8432, authorised by client-certificate CN.
[global]
log-path=/tmp
lock-path=/tmp
spool-path=/tmp
archive-async=y
archive-push-queue-max=2GiB
process-max=2
compress-type=zst
tls-server-address=*
tls-server-port=8432
tls-server-cert-file=/etc/pgbackrest-tls/server.crt
tls-server-key-file=/etc/pgbackrest-tls/server.key
tls-server-ca-file=/etc/pgbackrest-tls/ca.crt
tls-server-auth=pgbackrest-client=main

[main]
pg1-path=/data/pgdata
pg1-socket-path=/var/run/postgresql
pg1-port=5432
