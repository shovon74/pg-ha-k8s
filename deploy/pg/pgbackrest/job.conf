# pgBackRest in the stanza and backup Jobs (the repository host role). All three members are listed by
# stable headless-service DNS name. pgBackRest finds the current primary at run time, so a backup after
# failover needs no config change (ADR-009). Process settings only; the repository is in repo.conf.
[global]
log-path=/tmp
lock-path=/tmp
log-level-file=off
process-max=2
compress-type=zst
start-fast=y

[main]
pg1-host=pg-0.pg-headless.pg-ha.svc.cluster.local
pg1-host-type=tls
pg1-host-port=8432
pg1-host-cert-file=/etc/pgbackrest-tls/client.crt
pg1-host-key-file=/etc/pgbackrest-tls/client.key
pg1-host-ca-file=/etc/pgbackrest-tls/ca.crt
pg1-path=/data/pgdata
pg1-socket-path=/var/run/postgresql
pg2-host=pg-1.pg-headless.pg-ha.svc.cluster.local
pg2-host-type=tls
pg2-host-port=8432
pg2-host-cert-file=/etc/pgbackrest-tls/client.crt
pg2-host-key-file=/etc/pgbackrest-tls/client.key
pg2-host-ca-file=/etc/pgbackrest-tls/ca.crt
pg2-path=/data/pgdata
pg2-socket-path=/var/run/postgresql
pg3-host=pg-2.pg-headless.pg-ha.svc.cluster.local
pg3-host-type=tls
pg3-host-port=8432
pg3-host-cert-file=/etc/pgbackrest-tls/client.crt
pg3-host-key-file=/etc/pgbackrest-tls/client.key
pg3-host-ca-file=/etc/pgbackrest-tls/ca.crt
pg3-path=/data/pgdata
pg3-socket-path=/var/run/postgresql
